name: Build APK + Magisk Module

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify manager sources
        run: |
          test -f manager-app/app/src/main/java/com/virtualcam/manager/ui/screens/FailureDoctorCard.kt
          test -f manager-app/app/src/main/java/com/virtualcam/manager/data/PrerequisiteChecker.kt
          grep -n 'versionName' manager-app/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: manager-app
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Manager-debug
          path: manager-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK
        working-directory: manager-app
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Manager-release-unsigned
          path: manager-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-magisk:
    name: Build and Package Magisk Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Fetch Zygisk header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zygisk-native/jni

          curl --fail --show-error --silent --location \
            --retry 3 \
            -o zygisk-native/jni/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

          test -s zygisk-native/jni/zygisk.hpp

      - name: Fetch ShadowHook ARM libraries
        shell: bash
        run: |
          set -euo pipefail

          SHADOWHOOK_DIR="$(mktemp -d)"
          VERSION="1.0.10"
          URL="https://repo.maven.apache.org/maven2/com/bytedance/android/shadowhook/${VERSION}/shadowhook-${VERSION}.aar"

          curl --fail --show-error --silent --location \
            --retry 3 \
            -o "$SHADOWHOOK_DIR/shadowhook.aar" \
            "$URL"

          unzip -oq "$SHADOWHOOK_DIR/shadowhook.aar" \
            -d "$SHADOWHOOK_DIR"

          for ABI in arm64-v8a armeabi-v7a; do
            SOURCE="$SHADOWHOOK_DIR/jni/$ABI/libshadowhook.so"
            DESTINATION="$GITHUB_WORKSPACE/magisk-module/libs/$ABI"

            if [ ! -s "$SOURCE" ]; then
              echo "::error::Missing ShadowHook library for $ABI"
              exit 1
            fi

            mkdir -p "$DESTINATION"
            cp "$SOURCE" "$DESTINATION/libshadowhook.so"
          done

      - name: Verify native sources
        shell: bash
        run: |
          set -euo pipefail

          test -f zygisk-native/CMakeLists.txt
          test -f zygisk-native/jni/main.cpp
          test -f zygisk-native/jni/gl_hooks.cpp
          test -f zygisk-native/jni/gl_hooks.h
          test -f zygisk-native/jni/jni_camera_hooks.cpp
          test -f zygisk-native/jni/jni_camera_hooks.h
          test -f zygisk-native/jni/status_io.h
          test -f magisk-module/module.prop

          grep -n 'jni_camera_hooks' zygisk-native/CMakeLists.txt

      - name: Build Zygisk ARM libraries
        working-directory: zygisk-native
        shell: bash
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          mkdir -p ../magisk-module/zygisk

          for ABI in arm64-v8a armeabi-v7a; do
            BUILD_DIR="build-$ABI"

            cmake -S . -B "$BUILD_DIR" \
              "-DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake" \
              "-DANDROID_ABI=$ABI" \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release

            cmake --build "$BUILD_DIR" --parallel "$(nproc)"

            SO="$(find "$BUILD_DIR" -type f \
              -name libvirtualcam.so -print -quit)"

            if [ -z "$SO" ] || [ ! -s "$SO" ]; then
              echo "::error::Missing compiled libvirtualcam.so for $ABI"
              exit 1
            fi

            cp "$SO" "../magisk-module/zygisk/$ABI.so"
          done

      - name: Verify packaged libraries
        shell: bash
        run: |
          set -euo pipefail

          for ABI in arm64-v8a armeabi-v7a; do
            test -s "magisk-module/zygisk/$ABI.so"
            test -s "magisk-module/libs/$ABI/libshadowhook.so"
          done

          cp magisk-module/libs/arm64-v8a/libshadowhook.so \
            magisk-module/libshadowhook.so

      - name: Package Magisk ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd magisk-module
          zip -r ../VirtualCam-Manager-Magisk-v2.1.0.zip .
          unzip -t ../VirtualCam-Manager-Magisk-v2.1.0.zip

      - name: Upload Magisk ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Manager-Magisk-v2.1.0
          path: VirtualCam-Manager-Magisk-v2.1.0.zip
          if-no-files-found: error
